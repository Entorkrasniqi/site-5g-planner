[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site5g"
version = "0.1.0"
description = "Read a BIM/IFC building model and plan indoor 5G access-point placement with a wall-aware path-loss model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Entor Krasniqi" }]
dependencies = [
  "ifcopenshell>=0.8",
  "numpy>=1.26",
  "shapely>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
site5g = "site5g.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
